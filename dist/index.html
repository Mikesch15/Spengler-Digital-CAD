<style>
/* Fusion-artiger Arbeitsplatz: Werkzeugleiste, Browser links, Ansicht Mitte, Werkstatt rechts, Zeitleiste unten. */
:root {
  --bg: #e9edf0; --panel: #ffffff; --panel-2: #f4f6f8; --line: #d3d9de; --fg: #1d2429; --muted: #5f6b74;

  --font-body: "Barlow", "Segoe UI", system-ui, sans-serif; --font-label: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-num: "JetBrains Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #13181b; --panel: #1b2125; --panel-2: #222a2f; --line: #323b41; --fg: #e3e8eb; --muted: #93a0a8;
  --accent: #4fb89f; --accent-soft: #1d3a33; --bend: #ef6a5e; --view: #0f1418; --sketch: #6aa5ff; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #13181b; --panel: #1b2125; --panel-2: #222a2f; --line: #323b41; --fg: #e3e8eb; --muted: #93a0a8;
  --accent: #4fb89f; --accent-soft: #1d3a33; --bend: #ef6a5e; --view: #0f1418; --sketch: #6aa5ff; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 var(--font-body);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-block: 8px; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; }
.mitte { display: grid; grid-template-columns: 220px minmax(0, 1fr) 300px; gap: 8px; min-height: 0; }
@media (max-width: 1000px) { .mitte { grid-template-columns: minmax(0, 1fr); grid-template-rows: 60vh auto auto; } .browser { order: 2; } .werkstatt { order: 3; } .app { height: auto; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; overflow: auto; }
.ptitel { margin: 0; padding: 8px 12px; border-bottom: 1px solid var(--line); font: 600 12px var(--font-label); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
/* Werkzeugleiste */
.leiste { display: flex; gap: 6px; align-items: stretch; overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
.marke { display: flex; align-items: center; gap: 6px; padding: 0 8px; white-space: nowrap; font: 600 18px var(--font-label); }
.marke span { color: var(--accent); }
.gruppe { display: flex; flex-direction: column; border-left: 1px solid var(--line); padding: 0 6px; }
.gruppe .gtitel { font: 600 10px var(--font-label); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 0 4px 2px; }
.gruppe .knoepfe { display: flex; gap: 2px; }
.wz { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 62px; padding: 4px 6px; border: 1px solid transparent; border-radius: 6px;
  background: none; color: var(--fg); font: 500 12px var(--font-body); cursor: pointer; white-space: nowrap; }
.wz svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.wz:hover:not(:disabled) { background: var(--panel-2); border-color: var(--line); }
.wz[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.wz:disabled { opacity: .35; cursor: default; }
.skizzengruppe { background: color-mix(in srgb, var(--sketch) 10%, transparent); border-radius: 6px; }
/* Browser */
.baum { list-style: none; margin: 0; padding: 6px 0; }
.baum li { display: flex; align-items: center; gap: 6px; padding: 4px 12px; cursor: pointer; }
.baum li.kopf { font: 600 12px var(--font-label); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); cursor: default; padding-top: 10px; }
.baum li.aktiv { background: var(--accent-soft); }
.baum li .auge { margin-left: auto; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 13px; }
.baum li .typ { width: 14px; height: 14px; border-radius: 3px; flex: none; }
.typ.skizze { border: 1.5px solid var(--sketch); }
.typ.koerper { background: var(--muted); }
.typ.blech { background: var(--accent); }
/* Ansicht */
.ansicht { position: relative; background: var(--view); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; min-height: 300px; }
#leinwand { width: 100%; height: 100%; display: block; touch-action: none; }
.ansichtsknoepfe { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }
.ansichtsknoepfe button, .klein { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 5px; padding: 4px 8px; font: 600 12px var(--font-label); letter-spacing: .05em; text-transform: uppercase; cursor: pointer; }
#status { position: absolute; left: 8px; bottom: 8px; right: 8px; font-size: 13px; color: var(--muted); pointer-events: none; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#labels div { position: absolute; transform: translate(-50%, -50%); font: 600 11px var(--font-num); color: var(--sketch); background: color-mix(in srgb, var(--view) 80%, transparent); padding: 0 3px; border-radius: 3px; white-space: nowrap; }
#labels div.mass { pointer-events: auto; cursor: pointer; border: 1px solid transparent; }
#labels div.mass:hover { border-color: var(--sketch); }

.massfeld { position: absolute; transform: translate(-50%, -50%); width: 80px; font: 12px var(--font-num); border: 1.5px solid var(--sketch); border-radius: 4px; padding: 2px 4px; background: var(--panel); color: var(--fg); z-index: 5; }
.eingabe { position: absolute; display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--sketch); border-radius: 6px; padding: 4px; }

/* Befehlsdialog */
.dialog { position: absolute; top: 44px; right: 8px; width: 270px; max-width: calc(100% - 16px); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 24px rgb(0 0 0 / .15); }
.dialog h3 { margin: 0; padding: 8px 12px; font: 600 14px var(--font-label); letter-spacing: .06em; text-transform: uppercase; border-bottom: 1px solid var(--line); }
.dialog .inhalt { padding: 8px 12px; display: grid; gap: 6px; max-height: 55vh; overflow: auto; }
.feld { display: grid; grid-template-columns: 1fr 120px; align-items: center; gap: 6px; }
.feld input, .feld select { width: 100%; font: 13px var(--font-num); border: 1px solid var(--line); border-radius: 5px; padding: 5px 6px; background: var(--panel-2); color: var(--fg); }
.feld select { font-family: var(--font-body); }
.dialog .fuss { display: flex; gap: 6px; justify-content: flex-end; padding: 8px 12px; border-top: 1px solid var(--line); }
.knopf { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 6px; padding: 6px 12px; font: 600 13px var(--font-body); cursor: pointer; }
.knopf.haupt { background: var(--accent); border-color: var(--accent); color: #fff; }
.knopf.weg { color: var(--bend); margin-right: auto; }
.hinweis { font-size: 12px; color: var(--muted); }
/* Zeitleiste */
.zeitleiste { display: flex; align-items: center; gap: 6px; overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.zeitleiste .ztitel { font: 600 11px var(--font-label); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-right: 6px; white-space: nowrap; }
.zeitleiste button { display: flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); border-radius: 5px; padding: 4px 8px; font: 12px var(--font-body); cursor: pointer; white-space: nowrap; }
.zeitleiste .rechts { margin-left: auto; display: flex; gap: 6px; }
/* Werkstatt */
.zahl { display: flex; align-items: baseline; gap: 6px; padding: 10px 12px 0; }
.zahl b { font: 600 32px var(--font-num); }
.zahl span, .unter { color: var(--muted); font-size: 13px; }
.unter { padding: 0 12px 8px; }
.quelle { margin: 0 12px 10px; padding: 6px 8px; border-radius: 6px; background: var(--accent-soft); font-size: 13px; }
table.liste { width: 100%; border-collapse: collapse; font-size: 13px; }
table.liste th { font: 600 10px var(--font-label); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
table.liste td { padding: 5px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.num { font-family: var(--font-num); text-align: right !important; }
.bnr { font: 600 12px var(--font-num); color: var(--bend); }
.reihe { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; }
.leer { padding: 12px; color: var(--muted); }
.etikett { margin: 0 12px 12px; border: 1.5px dashed var(--muted); border-radius: 6px; padding: 8px 10px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; }
.etikett dt { color: var(--muted); font: 600 11px var(--font-label); text-transform: uppercase; }
.etikett dd { margin: 0; font-family: var(--font-num); }
.auftrag { padding: 8px 12px; display: grid; gap: 6px; border-top: 1px solid var(--line); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
</style>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
// ---- Spengler-Kern ----
const { ProfilFehler, berechne, polylinie, grenzen, kontur } = (() => {
// Spengler Digital CAD – Kern: Geometrie- und Abwicklungsrechnung
// Reines JavaScript ohne Abhängigkeiten. Läuft im Browser, in Node und später im PC-Programm.
//
// Ein Profil ist eine Folge von Operationen:
//   { typ: "schenkel", L }                         Schenkel, Länge mm
//   { typ: "biegung", winkel, ri, modus }          winkel in Grad (+ = links/oben, - = rechts/unten)
//        ri    Innenradius mm (null = Materialstandard)
//        modus "sharp"   Schenkelmasse bis zur virtuellen Kante
//              "hem"     180-Grad-Umschlag, Mass bis Aussenkante
//              "tangent" Rundung (Rinne, Wulst), gerade Längen bis Tangentenpunkt
// Gemessen wird auf der Blechmitte.

class ProfilFehler extends Error {}

const rad = (g) => (g * Math.PI) / 180;

function rueckversatz(op, t, riStd) {
  const ri = op.ri ?? riStd;
  const rm = ri + t / 2;
  if (op.modus === "tangent") return 0;
  if (op.modus === "hem" || Math.abs(op.winkel) >= 175) return rm + t / 2;
  return rm * Math.tan(rad(Math.abs(op.winkel)) / 2);
}

function berechne(startWinkel, ops, t, riStd, k) {
  if (!(t > 0)) throw new ProfilFehler("Blechdicke muss grösser als 0 sein");
  const gerade = new Map();
  ops.forEach((op, i) => {
    if (op.typ !== "schenkel") return;
    let sb = 0;
    if (ops[i - 1]?.typ === "biegung") sb += rueckversatz(ops[i - 1], t, riStd);
    if (ops[i + 1]?.typ === "biegung") sb += rueckversatz(ops[i + 1], t, riStd);
    const s = op.L - sb;
    if (s < -1e-6) {
      const nr = ops.slice(0, i + 1).filter((o) => o.typ === "schenkel").length;
      throw new ProfilFehler(`Schenkel ${nr} (${op.L} mm) ist zu kurz für die Biegeradien`);
    }
    gerade.set(i, Math.max(s, 0));
  });

  let x = 0, y = 0, th = rad(startWinkel);
  const pfad = [], biegungen = [], schenkel = [], beschriftungen = [];
  let pos = 0;
  ops.forEach((op, i) => {
    if (op.typ === "schenkel") {
      const s = gerade.get(i);
      schenkel.push(op.L);
      if (s > 1e-6) {
        const x2 = x + s * Math.cos(th), y2 = y + s * Math.sin(th);
        pfad.push({ typ: "linie", p1: [x, y], p2: [x2, y2] });
        beschriftungen.push({ x: (x + x2) / 2, y: (y + y2) / 2, richtung: th, mass: op.L, nr: schenkel.length });
        x = x2; y = y2;
      }
      pos += s;
    } else if (op.typ === "biegung") {
      const ri = op.ri ?? riStd;
      const a = rad(op.winkel);
      const rm = ri + t / 2;
      const sg = a > 0 ? 1 : -1;
      const cx = x - sg * rm * Math.sin(th), cy = y + sg * rm * Math.cos(th);
      const a0 = Math.atan2(y - cy, x - cx);
      const rot = (w) => [cx + rm * Math.cos(a0 + w), cy + rm * Math.sin(a0 + w)];
      const p2 = rot(a);
      pfad.push({ typ: "bogen", p1: [x, y], pm: rot(a / 2), p2, zentrum: [cx, cy], rm, start: a0, winkel: op.winkel });
      const bogenLaenge = (ri + k * t) * Math.abs(a);
      biegungen.push({
        nr: biegungen.length + 1,
        pos: pos + bogenLaenge / 2,
        von: pos,
        bis: pos + bogenLaenge,
        winkel: op.winkel,
        ri,
        art: { sharp: "Abkanten", hem: "Umschlag", tangent: "Rundung" }[op.modus],
        richtung: op.winkel > 0 ? "oben" : "unten",
      });
      pos += bogenLaenge;
      [x, y] = p2;
      th += a;
    } else {
      throw new ProfilFehler(`Unbekannte Operation ${JSON.stringify(op)}`);
    }
  });

  return {
    pfad,
    zuschnitt: pos,
    summeSchenkel: schenkel.reduce((s, v) => s + v, 0),
    biegungen,
    schenkel,
    beschriftungen,
    hatRundung: biegungen.some((b) => b.art === "Rundung"),
  };
}

// Pfad als Punktliste (Bögen fein unterteilt)
function polylinie(pfad, schrittGrad = 4) {
  const pts = [];
  const add = (p) => {
    const l = pts[pts.length - 1];
    if (!l || Math.hypot(l[0] - p[0], l[1] - p[1]) > 1e-6) pts.push(p);
  };
  for (const el of pfad) {
    if (el.typ === "linie") { add(el.p1); add(el.p2); continue; }
    const n = Math.max(4, Math.ceil(Math.abs(el.winkel) / schrittGrad));
    const a = rad(el.winkel);
    for (let i = 0; i <= n; i++) {
      const w = el.start + (a * i) / n;
      add([el.zentrum[0] + el.rm * Math.cos(w), el.zentrum[1] + el.rm * Math.sin(w)]);
    }
  }
  return pts;
}

function grenzen(pts) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  return { x0, y0, x1, y1 };
}

// Geschlossene Blechkontur (Querschnitt mit Dicke) für 3D und Export.
// Exakt: Linien parallel versetzt, Bögen mit Radius rm ± t/2.
function kontur(pfad, t, schrittGrad = 4) {
  const h = t / 2;
  const seite = (vz) => {
    const pts = [];
    const add = (p) => {
      const l = pts[pts.length - 1];
      if (!l || Math.hypot(l[0] - p[0], l[1] - p[1]) > 1e-6) pts.push(p);
    };
    for (const el of pfad) {
      if (el.typ === "linie") {
        const dx = el.p2[0] - el.p1[0], dy = el.p2[1] - el.p1[1], L = Math.hypot(dx, dy);
        const nx = (-dy / L) * h * vz, ny = (dx / L) * h * vz; // links = +
        add([el.p1[0] + nx, el.p1[1] + ny]);
        add([el.p2[0] + nx, el.p2[1] + ny]);
      } else {
        // Linke Seite liegt bei Linksbiegung innen (rm - h), bei Rechtsbiegung aussen
        const links = el.winkel > 0;
        const r = el.rm + (vz > 0 === links ? -h : h);
        const n = Math.max(4, Math.ceil(Math.abs(el.winkel) / schrittGrad));
        const a = rad(el.winkel);
        for (let i = 0; i <= n; i++) {
          const w = el.start + (a * i) / n;
          add([el.zentrum[0] + r * Math.cos(w), el.zentrum[1] + r * Math.sin(w)]);
        }
      }
    }
    return pts;
  };
  const links = seite(1), rechts = seite(-1);
  return links.concat(rechts.reverse());
}

      art: nxt?.modus === "hem" ? "umschlag" : "abkanten",

}

function abwicklungDxf(res, laenge, titel) {
  const out = ["0", "SECTION", "2", "ENTITIES"];
  const f = (v) => v.toFixed(4);
  const linie = (lay, x1, y1, x2, y2, farbe) => {

  };
  const text = (lay, x, y, h, s, farbe) => {
    out.push("0", "TEXT", "8", lay);
    if (farbe != null) out.push("62", String(farbe));
    out.push("10", f(x), "20", f(y), "30", "0", "40", h.toFixed(2), "1", ascii(s));
  };
  const W = res.zuschnitt, H = laenge;
  [[0, 0, W, 0], [W, 0, W, H], [W, H, 0, H], [0, H, 0, 0]].forEach(([a, b, c, d]) => linie("ZUSCHNITT", a, b, c, d, 7));
  for (const b of res.biegungen) {
    linie("BIEGELINIEN", b.pos, 0, b.pos, H, 1);
    text("TEXT", b.pos + 1.5, H + 4, 4, `B${b.nr} ${Math.abs(b.winkel)} ${b.richtung}`, 1);
  }
  text("TEXT", 0, -10, 6, `${titel}  Zuschnitt ${W.toFixed(1)} x ${H.toFixed(0)} mm  (Kante A links)`);

  out.push("0", "ENDSEC", "0", "EOF");
  return out.join("\n") + "\n";
}

function ascii(s) {
  return s.replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/Ä/g, "Ae")
    .replace(/Ö/g, "Oe").replace(/Ü/g, "Ue").replace(/[^\x20-\x7e]/g, "?");

    try {

        if (!f.versteckt && f !== skizze?.f) modell.add(skizzenObjekt(f));
      } else if (f.typ === "extrusion") {
        const s = finde(f.skizze); if (!s) throw new Error("Skizze fehlt");
        const fs = formen(s); if (!fs.length) throw new Error("Skizze hat kein geschlossenes Profil");
        if (!f.versteckt) modell.add(koerper(fs, s.ebene, f.abstand, f.richtung, 0x9aa5ad, f.id));
      } else if (f.typ === "blech") {
        const s = finde(f.skizze); if (!s) throw new Error("Skizze fehlt");
        const k = ketten(s)[f.kette || 0]; if (!k) throw new Error("Skizze hat keinen offenen Linienzug");
        const m = material(f.material);
        f._res = blechAusKette(k, m);
        if (!f.versteckt) modell.add(koerper([konturForm(f._res, m.t, k[0])], s.ebene, f.laenge, f.richtung, FARBE[m.id], f.id));
      } else if (f.typ === "vorlage") {
        const m = material(f.material), v = VORLAGE[f.vorlage];
        const { start, ops } = v.bau(f.params, m);
        f._res = berechne(start, ops, m.t, m.ri, m.k);
        if (!f.versteckt) modell.add(koerper([konturForm(f._res, m.t)], f.ebene, f.laenge, f.richtung, FARBE[m.id], f.id));
      }
    } catch (e) { f._fehler = e.message; }
  }
  markiere();
  zeigeBrowser(); zeigeZeit(); zeigeWerkstatt();
  speichern();
}

function markiere() {
  modell.children.forEach((o) => { if (o.isMesh) o.material.emissive?.setHex(o.userData.fid === auswahl ? 0x1d5c4f : 0x000000); });
}

function fitte(box) {

  const dir = kamera.position.clone().sub(steuerung.target).normalize();
  steuerung.target.copy(c); kamera.position.copy(c.clone().add(dir.multiplyScalar(r * 3)));
  kamera.near = r / 100; kamera.far = r * 50; kamera.updateProjectionMatrix();
}

    rechteck: "Rechteck: zwei Ecken anklicken oder Breite/Höhe eintippen.", kreis: "Kreis: Mittelpunkt, dann Radius anklicken oder Durchmesser eintippen." }[w]);

function starteSkizze(f) {

  skizzenRaster.applyMatrix4(new THREE.Matrix4().makeBasis(V(E.u), V(E.n), V(E.v).negate()));

  regen(); fitte(alleBox().isEmpty() ? new THREE.Box3(new THREE.Vector3(-150, -150, -150), new THREE.Vector3(150, 150, 150)) : alleBox());

function beendeSkizze() {

  skizze = null;
  if (!f.elemente.length) doc.features.splice(doc.features.indexOf(f), 1);

// Punkt auf der Skizzenebene unter dem Mauszeiger, mit Fang
const strahl = new THREE.Raycaster();
function ndc(e) { const r = leinwand.getBoundingClientRect(); return new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); }
function bildschirm(p) { const v = zu3D(skizze.f.ebene, p).project(kamera), r = leinwand.getBoundingClientRect(); return [(v.x + 1) / 2 * r.width, (1 - v.y) / 2 * r.height]; }
function fangPunkte() {
  const pts = [[0, 0]];
  for (const el of skizze.f.elemente) {
    if (el.art === "linie") pts.push(...el.pts);
    else if (el.art === "rechteck") pts.push(el.a, el.b, [el.a[0], el.b[1]], [el.b[0], el.a[1]]);
    else pts.push(el.c);
  }
  return pts.concat(skizze.pkt);
}
function ebenenPunkt(e) {
  strahl.setFromCamera(ndc(e), kamera);
  const E = EBENEN[skizze.f.ebene];
  const p = strahl.ray.intersectPlane(new THREE.Plane(V(E.n), 0), new THREE.Vector3());
  if (!p) return null;
  let uv = [p.dot(V(E.u)), p.dot(V(E.v))];
  const r = leinwand.getBoundingClientRect(), sm = [e.clientX - r.left, e.clientY - r.top];
  for (const q of fangPunkte()) { const s = bildschirm(q); if (Math.hypot(s[0] - sm[0], s[1] - sm[1]) < 10) return { uv: q.slice(), fang: true }; }
  if (!e.shiftKey) uv = uv.map((x) => Math.round(x / RASTER) * RASTER);
  const letzt = skizze.pkt.at(-1);
  if (letzt) { // waagrecht / senkrecht ausrichten
    const sl = bildschirm(letzt);
    if (Math.abs(bildschirm([letzt[0], uv[1]])[0] - sm[0]) < 8 && Math.abs(sl[0] - sm[0]) < 8) uv[0] = letzt[0];
    if (Math.abs(sl[1] - sm[1]) < 8) uv[1] = letzt[1];
  }
  return { uv };
}

function klick(uv, fang) {
  const s = skizze, el = s.f.elemente;
  if (s.werkzeug === "linie") {
    const erster = s.pkt[0];
    if (erster && s.pkt.length >= 3 && fang && uv[0] === erster[0] && uv[1] === erster[1]) {
      el.push({ art: "linie", pts: s.pkt.slice(), geschlossen: true }); s.pkt = [];
    } else if (!s.pkt.length || Math.hypot(uv[0] - s.pkt.at(-1)[0], uv[1] - s.pkt.at(-1)[1]) > 1e-6) s.pkt.push(uv);
  } else if (s.werkzeug === "rechteck") {
    if (!s.pkt.length) s.pkt.push(uv);
    else { const a = s.pkt[0]; if (a[0] !== uv[0] && a[1] !== uv[1]) el.push({ art: "rechteck", a: [Math.min(a[0], uv[0]), Math.min(a[1], uv[1])], b: [Math.max(a[0], uv[0]), Math.max(a[1], uv[1])] }); s.pkt = []; }
  } else if (s.werkzeug === "kreis") {
    if (!s.pkt.length) s.pkt.push(uv);
    else { const r = Math.hypot(uv[0] - s.pkt[0][0], uv[1] - s.pkt[0][1]); if (r > 0) el.push({ art: "kreis", c: s.pkt[0], r }); s.pkt = []; }
  }
  $("eLaenge").value = ""; $("eWinkel").value = "";
  zeichneLive();
}
function abschliessenLinie() {
  if (skizze?.werkzeug === "linie" && skizze.pkt.length >= 2) skizze.f.elemente.push({ art: "linie", pts: skizze.pkt.slice(), geschlossen: false });
  if (skizze) skizze.pkt = [];
  zeichneLive();
}
// Getippte Masse anwenden
function eingabeAnwenden() {
  const s = skizze; if (!s?.pkt.length) return;
  const a = parseFloat($("eLaenge").value), b = parseFloat($("eWinkel").value), p = s.pkt.at(-1), m = s.maus || p;
  if (s.werkzeug === "linie" && a > 0) {
    const w = Number.isFinite(b) ? (b * Math.PI) / 180 : Math.atan2(m[1] - p[1], m[0] - p[0]);
    klick([+(p[0] + a * Math.cos(w)).toFixed(4), +(p[1] + a * Math.sin(w)).toFixed(4)]);
  } else if (s.werkzeug === "rechteck" && a > 0 && b > 0) {
    klick([p[0] + a * (m[0] >= p[0] ? 1 : -1), p[1] + b * (m[1] >= p[1] ? 1 : -1)]);
  } else if (s.werkzeug === "kreis" && a > 0) klick([p[0] + a / 2, p[1]]);
}

// ------------------------------------------------------------ Bemassung und Auswahl
const gleich = (a, b) => Math.abs(a[0] - b[0]) < 1e-6 && Math.abs(a[1] - b[1]) < 1e-6;
const drehung = (pts, i) => { // vorzeichenbehafteter Knickwinkel am Punkt i (Grad)
  const n = pts.length, a = pts[(i - 1 + n) % n], b = pts[i], c = pts[(i + 1) % n];
  let d = Math.atan2(c[1] - b[1], c[0] - b[0]) - Math.atan2(b[1] - a[1], b[0] - a[0]);
  while (d > Math.PI) d -= 2 * Math.PI; while (d <= -Math.PI) d += 2 * Math.PI;
  return (d * 180) / Math.PI;
};
function massAendern(m, wert) {
  const el = m.el;
  if (!Number.isFinite(wert) || wert <= 0) return status("Bitte einen Wert grösser als 0 eingeben.");
  if (m.art === "laenge") {
    const n = el.pts.length, i = m.i, j = (i + 1) % n, p = el.pts[i], q = el.pts[j];
    const L = Math.hypot(q[0] - p[0], q[1] - p[1]); if (!L) return;
    const d = [((q[0] - p[0]) / L) * (wert - L), ((q[1] - p[1]) / L) * (wert - L)];
    if (el.geschlossen && j === 0) el.pts[i] = [p[0] - d[0], p[1] - d[1]];
    else for (let k = j; k < n; k++) el.pts[k] = [el.pts[k][0] + d[0], el.pts[k][1] + d[1]];
  } else if (m.art === "winkel") {
    const cur = drehung(el.pts, m.i), neu = (cur < 0 ? -1 : 1) * wert, r = ((neu - cur) * Math.PI) / 180, z = el.pts[m.i];
    const c = Math.cos(r), sn = Math.sin(r);
    for (let k = m.i + 1; k < el.pts.length; k++) { const dx = el.pts[k][0] - z[0], dy = el.pts[k][1] - z[1]; el.pts[k] = [z[0] + dx * c - dy * sn, z[1] + dx * sn + dy * c]; }
  } else if (m.art === "breite") el.b[0] = el.a[0] + wert;
  else if (m.art === "hoehe") el.b[1] = el.a[1] + wert;
  else if (m.art === "durchmesser") el.r = wert / 2;
  zeichneLive();
}
function verschiebePunkt(q, uv) {
  for (const el of skizze.f.elemente) {
    if (el.art === "linie") el.pts = el.pts.map((p) => (gleich(p, q) ? uv.slice() : p));
    else if (el.art === "kreis") { if (gleich(el.c, q)) el.c = uv.slice(); }
    else {
      if (gleich(el.a, q)) el.a = uv.slice(); else if (gleich(el.b, q)) el.b = uv.slice();
      else if (gleich([el.a[0], el.b[1]], q)) { el.a = [uv[0], el.a[1]]; el.b = [el.b[0], uv[1]]; }
      else if (gleich([el.b[0], el.a[1]], q)) { el.b = [uv[0], el.b[1]]; el.a = [el.a[0], uv[1]]; }
    }
  }
}
function ordneRechtecke() {
  for (const el of skizze.f.elemente) if (el.art === "rechteck") { const a = el.a, b = el.b; el.a = [Math.min(a[0], b[0]), Math.min(a[1], b[1])]; el.b = [Math.max(a[0], b[0]), Math.max(a[1], b[1])]; }
}
function segmente(el) {
  if (el.art === "linie") return el.pts.map((p, i) => [p, el.pts[i + 1] || (el.geschlossen ? el.pts[0] : null)]).filter((x) => x[1]);
  if (el.art === "rechteck") { const c = [el.a, [el.b[0], el.a[1]], el.b, [el.a[0], el.b[1]]]; return c.map((p, i) => [p, c[(i + 1) % 4]]); }
  const k = Array.from({ length: 48 }, (_, i) => [el.c[0] + el.r * Math.cos(i * Math.PI / 24), el.c[1] + el.r * Math.sin(i * Math.PI / 24)]);
  return k.map((p, i) => [p, k[(i + 1) % 48]]);
}
function trefferElement(sm) {
  let best = null, bd = 8;
  for (const el of skizze.f.elemente) for (const [a, b] of segmente(el)) {
    const A = bildschirm(a), B = bildschirm(b), dx = B[0] - A[0], dy = B[1] - A[1], l2 = dx * dx + dy * dy || 1;
    const t = Math.max(0, Math.min(1, ((sm[0] - A[0]) * dx + (sm[1] - A[1]) * dy) / l2));
    const d = Math.hypot(sm[0] - A[0] - t * dx, sm[1] - A[1] - t * dy);
    if (d < bd) { bd = d; best = el; }
  }
  return best;
}
function trefferPunkt(sm) {
  for (const el of skizze.f.elemente) {
    const pts = el.art === "linie" ? el.pts : el.art === "kreis" ? [el.c] : [el.a, el.b, [el.a[0], el.b[1]], [el.b[0], el.a[1]]];
    for (const p of pts) { const s = bildschirm(p); if (Math.hypot(s[0] - sm[0], s[1] - sm[1]) < 10) return p.slice(); }
  }
  return null;
}
// Mass anklicken: Eingabefeld über dem Mass
$("labels").addEventListener("click", (e) => {
  const d = e.target.closest(".mass"); if (!d || !skizze) return;
  const l = labels[+d.dataset.i]; if (!l?.edit) return;
  const inp = document.createElement("input");
  inp.type = "number"; inp.step = "any"; inp.className = "massfeld"; inp.value = parseFloat(l.t.replace(/[^\d.\-]/g, ""));
  inp.style.left = d.style.left; inp.style.top = d.style.top;
  $("ansicht").appendChild(inp); inp.focus(); inp.select();
  const fertig = (ok) => { if (ok) massAendern(l.edit, parseFloat(inp.value)); inp.remove(); };
  inp.addEventListener("keydown", (ev) => { ev.stopPropagation(); if (ev.key === "Enter") fertig(true); if (ev.key === "Escape") fertig(false); });
  inp.addEventListener("blur", () => fertig(false));
});

let labels = [];
function zeichneLive() {
  leeren(live); labels = [];
  if (!skizze) return;
  const f = skizze.f, s = skizze;
  live.add(skizzenObjekt(f, 0x1f5fbf));
  const temp = { ebene: f.ebene, elemente: [] };
  const m = s.maus;
  if (s.pkt.length && m) {
    if (s.werkzeug === "linie") temp.elemente.push({ art: "linie", pts: [...s.pkt, m] });
    if (s.werkzeug === "rechteck") temp.elemente.push({ art: "rechteck", a: s.pkt[0], b: m });
    if (s.werkzeug === "kreis") temp.elemente.push({ art: "kreis", c: s.pkt[0], r: Math.hypot(m[0] - s.pkt[0][0], m[1] - s.pkt[0][1]) || 0.001 });
  } else if (s.pkt.length > 1) temp.elemente.push({ art: "linie", pts: s.pkt });
  live.add(skizzenObjekt(temp, 0xe0782b));
  // Punkte
  const pts = fangPunkte().concat(m ? [m] : []);
  const pg = new THREE.BufferGeometry().setFromPoints(pts.map((p) => zu3D(f.ebene, p)));
  const pk = new THREE.Points(pg, new THREE.PointsMaterial({ color: 0x1f5fbf, size: 6, sizeAttenuation: false, depthTest: false })); pk.renderOrder = 11; live.add(pk);
  // Masse
  if (s.sel && f.elemente.includes(s.sel)) live.add(skizzenObjekt({ ebene: f.ebene, elemente: [s.sel] }, 0xe0782b));
  const lab = (a, b, txt, edit, winkel) => labels.push({ p: zu3D(f.ebene, [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]), t: txt, edit, winkel });
  const fest = new Set(f.elemente);
  for (const el of [...f.elemente, ...temp.elemente]) {
    const ed = fest.has(el);
    if (el.art === "linie") {
      el.pts.forEach((p, i) => { const q = el.pts[i + 1] || (el.geschlossen ? el.pts[0] : null); if (q) lab(p, q, f1(Math.hypot(q[0] - p[0], q[1] - p[1])), ed && { el, art: "laenge", i }); });
      const n = el.pts.length;
      for (let i = el.geschlossen ? 0 : 1; i < (el.geschlossen ? n : n - 1); i++) {
        const w = drehung(el.pts, i);
        if (Math.abs(w) > 0.05 && n > 2) lab(el.pts[i], el.pts[i], Math.abs(w).toFixed(1).replace(/\.0$/, "") + "°", ed && !el.geschlossen && { el, art: "winkel", i }, true);
      }
    } else if (el.art === "rechteck") {
      lab(el.a, [el.b[0], el.a[1]], f1(Math.abs(el.b[0] - el.a[0])), ed && { el, art: "breite" });
      lab(el.a, [el.a[0], el.b[1]], f1(Math.abs(el.b[1] - el.a[1])), ed && { el, art: "hoehe" });
    } else lab(el.c, [el.c[0] + el.r * 2, el.c[1]], "Ø " + f1(el.r * 2), ed && { el, art: "durchmesser" });
  }
  if (m) status(`u ${f1(m[0])}  v ${f1(m[1])} mm · ${f.name} auf ${EBENEN[f.ebene].name}`);
}
function zeigeLabels() {
  const box = $("labels");
  while (box.children.length < labels.length) box.appendChild(document.createElement("div"));
  [...box.children].forEach((d, i) => {
    const l = labels[i];
    if (!l) { d.hidden = true; return; }
    const v = l.p.clone().project(kamera);
    d.hidden = false; d.textContent = l.t; d.dataset.i = i;
    d.className = (l.edit ? "mass" : "") + (l.winkel ? " winkel" : "");
    d.style.left = ((v.x + 1) / 2) * 100 + "%"; d.style.top = ((1 - v.y) / 2) * 100 + "%";
  });
}

// ------------------------------------------------------------ Maus und Tastatur
let runter = null;
leinwand.addEventListener("contextmenu", (e) => e.preventDefault());
const smPos = (e) => { const r = leinwand.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
leinwand.addEventListener("pointerdown", (e) => {
  runter = { x: e.clientX, y: e.clientY, b: e.button };
  if (skizze?.werkzeug === "auswahl" && e.button === 0) {
    const p = trefferPunkt(smPos(e));
    if (p) { skizze.zug = { q: p }; leinwand.setPointerCapture(e.pointerId); }
  }
});
leinwand.addEventListener("pointermove", (e) => {
  if (!skizze) return;
  if (skizze.zug) {
    const E = EBENEN[skizze.f.ebene]; strahl.setFromCamera(ndc(e), kamera);
    const p = strahl.ray.intersectPlane(new THREE.Plane(V(E.n), 0), new THREE.Vector3()); if (!p) return;
    let uv = [p.dot(V(E.u)), p.dot(V(E.v))];
    if (!e.shiftKey) uv = uv.map((x) => Math.round(x / RASTER) * RASTER);
    if (!gleich(uv, skizze.zug.q)) { verschiebePunkt(skizze.zug.q, uv); skizze.zug.q = uv; zeichneLive(); }
    return;
  }
  const r = ebenenPunkt(e); if (!r) return;
  skizze.maus = r.uv; zeichneLive();
  if (skizze.pkt.length) {
    const rr = leinwand.getBoundingClientRect(), ein = $("eingabe");
    ein.hidden = false; ein.style.left = Math.min(e.clientX - rr.left + 16, rr.width - 170) + "px"; ein.style.top = (e.clientY - rr.top + 16) + "px";
    ein.querySelector("label").firstChild.textContent = skizze.werkzeug === "kreis" ? "Ø " : skizze.werkzeug === "rechteck" ? "B " : "L ";
    ein.querySelectorAll("label")[1].firstChild.textContent = skizze.werkzeug === "rechteck" ? "H " : "∠ ";
    ein.querySelectorAll("label")[1].hidden = skizze.werkzeug === "kreis";
  } else $("eingabe").hidden = true;
});
leinwand.addEventListener("pointerup", (e) => {
  if (skizze?.zug) { skizze.zug = null; ordneRechtecke(); zeichneLive(); runter = null; return; }
  if (!runter || Math.hypot(e.clientX - runter.x, e.clientY - runter.y) > 5 || runter.b !== 0) { runter = null; return; }
  runter = null;
  if (skizze?.zug) { skizze.zug = null; ordneRechtecke(); zeichneLive(); return; }
  if (skizze?.werkzeug === "auswahl") { skizze.sel = trefferElement(smPos(e)); zeichneLive(); return; }
  if (skizze) { const r = ebenenPunkt(e); if (r) klick(r.uv, r.fang); return; }
  strahl.setFromCamera(ndc(e), kamera);
  const treffer = strahl.intersectObjects(modell.children.filter((o) => o.isMesh), false)[0];
  waehle(treffer ? treffer.object.userData.fid : null);
});
leinwand.addEventListener("dblclick", () => { if (skizze?.werkzeug === "linie") abschliessenLinie(); });
document.addEventListener("keydown", (e) => {
  if (!skizze) return;
  const imFeld = e.target.closest?.("#eingabe");
  if (e.key === "Escape") { if (skizze.pkt.length) { abschliessenLinie(); skizze.pkt = []; zeichneLive(); } else if (skizze.werkzeug !== "auswahl") setzeWerkzeug("auswahl"); else { skizze.sel = null; zeichneLive(); } e.preventDefault(); return; }
  if ((e.key === "Delete" || e.key === "Backspace") && skizze.sel && !e.target.closest?.("input,select")) {
    skizze.f.elemente.splice(skizze.f.elemente.indexOf(skizze.sel), 1); skizze.sel = null; zeichneLive(); e.preventDefault(); return;
  }
  if (e.key === "Enter") { if (imFeld) eingabeAnwenden(); else abschliessenLinie(); e.preventDefault(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key === "z") { if (skizze.pkt.length) skizze.pkt.pop(); else skizze.f.elemente.pop(); zeichneLive(); e.preventDefault(); return; }
  if (!imFeld && skizze.pkt.length && /^[\d.\-]$/.test(e.key) && !e.target.closest?.("input,select")) {
    $("eingabe").hidden = false; $("eLaenge").value = e.key; $("eLaenge").focus(); e.preventDefault();
  }
});

// ------------------------------------------------------------ Werkzeugleiste
$("wSkizze").onclick = () => {
  if (dlg) $("dAbbrechen").click();
  dialog({ titel: "Skizze erstellen", felder: [{ id: "ebene", label: "Ebene", optionen: Object.entries(EBENEN).map(([k, e]) => [k, e.name]), wert: "XY" }],
    hinweis: "Für Blechprofile den Querschnitt zeichnen, meist auf Vorne (XY).",
    ok: (w) => { const f = { id: neueId(), typ: "skizze", name: "Skizze " + (doc.features.filter((x) => x.typ === "skizze").length + 1), ebene: w.ebene, elemente: [] }; doc.features.push(f); setTimeout(() => starteSkizze(f)); } });
};
$("wExtrusion").onclick = () => { if (dlg) $("dAbbrechen").click(); extrusionDialog(); };
$("wBlech").onclick = () => { if (dlg) $("dAbbrechen").click(); blechDialog(); };
$("wVorlage").onclick = () => { if (dlg) $("dAbbrechen").click(); vorlageDialog(); };
$("tAuswahl").onclick = () => { abschliessenLinie(); setzeWerkzeug("auswahl"); };
$("tLinie").onclick = () => { abschliessenLinie(); setzeWerkzeug("linie"); };
$("tRechteck").onclick = () => { abschliessenLinie(); setzeWerkzeug("rechteck"); };
$("tKreis").onclick = () => { abschliessenLinie(); setzeWerkzeug("kreis"); };
$("tFertig").onclick = beendeSkizze;
$("wSpeichern").onclick = () => herunterladen(`${doc.nr || "projekt"}.sdcad`, JSON.stringify(doc, (k, v) => (k.startsWith("_") ? undefined : v), 1), "application/json");
$("wOeffnen").onclick = () => $("datei").click();
$("datei").onchange = async (e) => {
  try { const d = JSON.parse(await e.target.files[0].text()); if (!d.features) throw 0; doc = d; auswahl = null; $("aObjekt").value = doc.objekt; $("aNr").value = doc.nr; regen(); ansicht("iso"); status("Projekt geöffnet."); }
  catch { status("Diese Datei ist kein Spengler-Digital-CAD-Projekt."); }
  e.target.value = "";
};
let neuBestaetigt = 0;
$("wNeu").onclick = () => {
  if (Date.now() - neuBestaetigt > 3000) { neuBestaetigt = Date.now(); status("Nochmals «Neu» klicken, um alles zu löschen."); return; }
  doc = { features: [], zaehler: 1, objekt: doc.objekt, nr: doc.nr }; auswahl = null; regen(); status("Neues Projekt.");
};

// ------------------------------------------------------------ Start
groesse();
if (!doc.features.length) { // Beispiel: Traufblech als Vorlage
  doc.features.push({ id: neueId(), typ: "vorlage", name: "Traufblech", vorlage: "traufe", params: standardwerte("traufe"), material: MATERIALIEN[0].id, laenge: 1000, richtung: "eine", ebene: "XY" });
}
regen();
auswahl = doc.features.find((f) => f._res)?.id || null; markiere(); zeigeBrowser(); zeigeWerkstatt();
ansicht("iso");
(function schleife() { steuerung.update(); renderer.render(szene, kamera); zeigeLabels(); requestAnimationFrame(schleife); })();
status("Beispiel geladen. Neu zeichnen: «Skizze» → Ebene wählen → Linienzug zeichnen → «Blechprofil».");

</script>
