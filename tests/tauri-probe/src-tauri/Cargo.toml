[package]
name = "sdcad-cad-probe"
version = "0.1.0"
description = "Windows-Nachweis: CAD-Kern (OpenCascade WASM) im Web Worker unter Tauri 2 / WebView2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[profile.release]
opt-level = "s"
strip = true
