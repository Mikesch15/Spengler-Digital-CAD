<meta charset="utf-8">
<title>Spengler Digital CAD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#217a68">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
/*SCHRIFTEN*/
/* Fusion-artiger Arbeitsplatz: Werkzeugleiste, Browser links, Ansicht Mitte, Werkstatt rechts, Zeitleiste unten. */
:root {
  --bg: #e9edf0; --panel: #ffffff; --panel-2: #f4f6f8; --line: #d3d9de; --fg: #1d2429; --muted: #5f6b74;
  --accent: #217a68; --accent-soft: #dcefe9; --bend: #c4352b; --view: #dfe5e9; --sketch: #1f5fbf;
  --font-body: "Barlow", "Segoe UI", system-ui, sans-serif; --font-label: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-num: "JetBrains Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #13181b; --panel: #1b2125; --panel-2: #222a2f; --line: #323b41; --fg: #e3e8eb; --muted: #93a0a8;
  --accent: #4fb89f; --accent-soft: #1d3a33; --bend: #ef6a5e; --view: #0f1418; --sketch: #6aa5ff; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #13181b; --panel: #1b2125; --panel-2: #222a2f; --line: #323b41; --fg: #e3e8eb; --muted: #93a0a8;
  --accent: #4fb89f; --accent-soft: #1d3a33; --bend: #ef6a5e; --view: #0f1418; --sketch: #6aa5ff; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 var(--font-body);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-block: 8px; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; }
.mitte { display: grid; grid-template-columns: 220px minmax(0, 1fr) 300px; gap: 8px; min-height: 0; }
@media (max-width: 1000px) { .mitte { grid-template-columns: minmax(0, 1fr); grid-template-rows: 60vh auto auto; } .browser { order: 2; } .werkstatt { order: 3; } .app { height: auto; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; overflow: auto; }
.ptitel { margin: 0; padding: 8px 12px; border-bottom: 1px solid var(--line); font: 600 12px var(--font-label); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
/* Werkzeugleiste */
.leiste { display: flex; gap: 6px; align-items: stretch; overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
.marke { display: flex; align-items: center; gap: 6px; padding: 0 8px; white-space: nowrap; font: 600 18px var(--font-label); }
.marke span { color: var(--accent); }
.gruppe { display: flex; flex-direction: column; border-left: 1px solid var(--line); padding: 0 6px; }
.gruppe .gtitel { font: 600 10px var(--font-label); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 0 4px 2px; }
.gruppe .knoepfe { display: flex; gap: 2px; }
.wz { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 62px; padding: 4px 6px; border: 1px solid transparent; border-radius: 6px;
  background: none; color: var(--fg); font: 500 12px var(--font-body); cursor: pointer; white-space: nowrap; }
.wz svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.wz:hover:not(:disabled) { background: var(--panel-2); border-color: var(--line); }
.wz[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.wz:disabled { opacity: .35; cursor: default; }
.skizzengruppe { background: color-mix(in srgb, var(--sketch) 10%, transparent); border-radius: 6px; }
/* Browser */
.baum { list-style: none; margin: 0; padding: 6px 0; }
.baum li { display: flex; align-items: center; gap: 6px; padding: 4px 12px; cursor: pointer; }
.baum li.kopf { font: 600 12px var(--font-label); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); cursor: default; padding-top: 10px; }
.baum li.aktiv { background: var(--accent-soft); }
.baum li .auge { margin-left: auto; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 13px; }
.baum li .typ { width: 14px; height: 14px; border-radius: 3px; flex: none; }
.typ.skizze { border: 1.5px solid var(--sketch); }
.typ.koerper { background: var(--muted); }
.typ.blech { background: var(--accent); }
/* Ansicht */
.ansicht { position: relative; background: var(--view); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; min-height: 300px; }
#leinwand { width: 100%; height: 100%; display: block; touch-action: none; }
.ansichtsknoepfe { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }
.ansichtsknoepfe button, .klein { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 5px; padding: 4px 8px; font: 600 12px var(--font-label); letter-spacing: .05em; text-transform: uppercase; cursor: pointer; }
#status { position: absolute; left: 8px; bottom: 8px; right: 8px; font-size: 13px; color: var(--muted); pointer-events: none; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#labels div { position: absolute; transform: translate(-50%, -50%); font: 600 11px var(--font-num); color: var(--sketch); background: color-mix(in srgb, var(--view) 80%, transparent); padding: 0 3px; border-radius: 3px; white-space: nowrap; }
#labels div.mass { pointer-events: auto; cursor: pointer; border: 1px solid transparent; }
#labels div.mass:hover { border-color: var(--sketch); }
#labels div.winkel { color: #c25e14; transform: translate(8px, -130%); }
.massfeld { position: absolute; transform: translate(-50%, -50%); width: 80px; font: 12px var(--font-num); border: 1.5px solid var(--sketch); border-radius: 4px; padding: 2px 4px; background: var(--panel); color: var(--fg); z-index: 5; }
.eingabe { position: absolute; display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--sketch); border-radius: 6px; padding: 4px; }
.eingabe label { display: flex; align-items: center; gap: 3px; font: 600 11px var(--font-label); color: var(--muted); text-transform: uppercase; }
.eingabe input { width: 64px; font: 12px var(--font-num); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; background: var(--panel-2); color: var(--fg); }
/* Befehlsdialog */
.dialog { position: absolute; top: 44px; right: 8px; width: 270px; max-width: calc(100% - 16px); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 24px rgb(0 0 0 / .15); }
.dialog h3 { margin: 0; padding: 8px 12px; font: 600 14px var(--font-label); letter-spacing: .06em; text-transform: uppercase; border-bottom: 1px solid var(--line); }
.dialog .inhalt { padding: 8px 12px; display: grid; gap: 6px; max-height: 55vh; overflow: auto; }
.feld { display: grid; grid-template-columns: 1fr 120px; align-items: center; gap: 6px; }
.feld input, .feld select { width: 100%; font: 13px var(--font-num); border: 1px solid var(--line); border-radius: 5px; padding: 5px 6px; background: var(--panel-2); color: var(--fg); }
.feld select { font-family: var(--font-body); }
.dialog .fuss { display: flex; gap: 6px; justify-content: flex-end; padding: 8px 12px; border-top: 1px solid var(--line); }
.knopf { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 6px; padding: 6px 12px; font: 600 13px var(--font-body); cursor: pointer; }
.knopf.haupt { background: var(--accent); border-color: var(--accent); color: #fff; }
.knopf.weg { color: var(--bend); margin-right: auto; }
.hinweis { font-size: 12px; color: var(--muted); }
/* Zeitleiste */
.zeitleiste { display: flex; align-items: center; gap: 6px; overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.zeitleiste .ztitel { font: 600 11px var(--font-label); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-right: 6px; white-space: nowrap; }
.zeitleiste button { display: flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); border-radius: 5px; padding: 4px 8px; font: 12px var(--font-body); cursor: pointer; white-space: nowrap; }
.zeitleiste .rechts { margin-left: auto; display: flex; gap: 6px; }
.zeitleiste button:disabled { opacity: .4; cursor: default; }
/* Werkstatt */
.zahl { display: flex; align-items: baseline; gap: 6px; padding: 10px 12px 0; }
.zahl b { font: 600 32px var(--font-num); }
.zahl span, .unter { color: var(--muted); font-size: 13px; }
.unter { padding: 0 12px 8px; }
.quelle { margin: 0 12px 10px; padding: 6px 8px; border-radius: 6px; background: var(--accent-soft); font-size: 13px; }
table.liste { width: 100%; border-collapse: collapse; font-size: 13px; }
table.liste th { font: 600 10px var(--font-label); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
table.liste td { padding: 5px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.num { font-family: var(--font-num); text-align: right !important; }
.bnr { font: 600 12px var(--font-num); color: var(--bend); }
.reihe { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; }
.leer { padding: 12px; color: var(--muted); }
.etikett { margin: 0 12px 12px; border: 1.5px dashed var(--muted); border-radius: 6px; padding: 8px 10px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; }
.etikett dt { color: var(--muted); font: 600 11px var(--font-label); text-transform: uppercase; }
.etikett dd { margin: 0; font-family: var(--font-num); }
.auftrag { padding: 8px 12px; display: grid; gap: 6px; border-top: 1px solid var(--line); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
</style>

<div class="app">
  <nav class="leiste" aria-label="Werkzeuge">
    <div class="marke">Spengler Digital <span>CAD</span></div>
    <div class="gruppe"><div class="gtitel">Erstellen</div><div class="knoepfe">
      <button class="wz" id="wSkizze"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 16l4-8 3 5 3-3"/></svg>Skizze</button>
      <button class="wz" id="wExtrusion"><svg viewBox="0 0 24 24"><path d="M4 16l8 4 8-4M4 16V9l8-4 8 4v7M12 13v7M4 9l8 4 8-4"/></svg>Extrudieren</button>
      <button class="wz" id="wBlech"><svg viewBox="0 0 24 24"><path d="M3 18h6l4-10h8"/><path d="M3 21h6l4-10h8" opacity=".5"/></svg>Blechprofil</button>
      <button class="wz" id="wVorlage"><svg viewBox="0 0 24 24"><path d="M3 6h10l-3 12h11"/><circle cx="3" cy="6" r="1.5"/></svg>Spengler-Vorlage</button>
    </div></div>
    <div class="gruppe skizzengruppe" id="gSkizze" hidden><div class="gtitel">Skizze</div><div class="knoepfe">
      <button class="wz" id="tAuswahl"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg>Auswahl</button>
      <button class="wz" id="tLinie"><svg viewBox="0 0 24 24"><path d="M4 20L20 4"/><circle cx="4" cy="20" r="1.8"/><circle cx="20" cy="4" r="1.8"/></svg>Linie</button>
      <button class="wz" id="tRechteck"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12"/></svg>Rechteck</button>
      <button class="wz" id="tKreis"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 12h8"/></svg>Kreis</button>
      <button class="wz" id="tFertig"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>Skizze beenden</button>
    </div></div>
    <div class="gruppe"><div class="gtitel">Datei</div><div class="knoepfe">
      <button class="wz" id="wSpeichern"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>Speichern</button>
      <button class="wz" id="wOeffnen"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg>Öffnen</button>
      <button class="wz" id="wNeu"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M12 10v6M9 13h6"/></svg>Neu</button>
      <input type="file" id="datei" accept=".json,.sdcad" hidden>
    </div></div>
  </nav>

  <div class="mitte">
    <aside class="panel browser"><h2 class="ptitel">Browser</h2><ul class="baum" id="baum"></ul></aside>
    <section class="ansicht" id="ansicht">
      <canvas id="leinwand" aria-label="3D-Ansicht"></canvas>
      <div id="labels"></div>
      <div class="ansichtsknoepfe">
        <button data-ansicht="oben">Oben</button><button data-ansicht="vorne">Vorne</button>
        <button data-ansicht="rechts">Rechts</button><button data-ansicht="iso">Iso</button><button id="zoomAlles">Alles</button>
      </div>
      <div class="eingabe" id="eingabe" hidden>
        <label>L <input id="eLaenge" type="number" step="any"></label><label>∠ <input id="eWinkel" type="number" step="any"></label>
      </div>
      <div class="dialog" id="dialog" hidden><h3 id="dTitel"></h3><div class="inhalt" id="dInhalt"></div>
        <div class="fuss"><button class="knopf weg" id="dLoeschen" hidden>Löschen</button><button class="knopf" id="dAbbrechen">Abbrechen</button><button class="knopf haupt" id="dOk">OK</button></div></div>
      <div id="status"></div>
    </section>
    <aside class="panel werkstatt"><h2 class="ptitel">Werkstatt</h2><div id="werkstatt"></div>
      <div class="auftrag">
        <div class="feld"><label for="aObjekt">Objekt</label><input id="aObjekt"></div>
        <div class="feld"><label for="aNr">Objektnummer</label><input id="aNr"></div>
      </div>
    </aside>
  </div>

  <footer class="zeitleiste" aria-label="Zeitleiste"><span class="ztitel">Zeitleiste</span><span id="zeit"></span>
    <span class="rechts"><button id="zurueck" title="Rückgängig (Strg+Z)">↶ Rückgängig</button><button id="vor" title="Wiederholen (Strg+Y)">↷ Wiederholen</button>
      <button id="rueckgaengig">Letzten Schritt löschen</button></span></footer>
</div>

<script type="module">
/*APP*/
</script>
